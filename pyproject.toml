[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glpi-anonymizer"
version = "0.1.0"
description = "Remove personal data from GLPI ticket exports, with Moroccan identifier support (CIN, RIB, ICE, GSM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["glpi", "anonymization", "pii", "gdpr", "morocco", "itsm", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
glpi-anonymize = "glpi_anonymizer.cli:main"

[project.urls]
Homepage = "https://github.com/novagiosAI/glpi-anonymizer"
Repository = "https://github.com/novagiosAI/glpi-anonymizer"
Issues = "https://github.com/novagiosAI/glpi-anonymizer/issues"
Changelog = "https://github.com/novagiosAI/glpi-anonymizer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/glpi_anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/glpi_anonymizer"]
